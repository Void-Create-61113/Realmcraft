<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realmcraft</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#fff}
#game{display:block;width:100%;height:100%;image-rendering:pixelated}
#crosshair{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#crosshair:before{width:2px;height:14px;left:6px}#crosshair:after{width:14px;height:2px;top:6px}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.45);padding:8px 10px;border-radius:5px}
#help{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.45);padding:8px 10px;border-radius:5px;text-align:right}
#hotbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.slot{width:48px;height:48px;border:2px solid #555;background:rgba(0,0,0,.65);display:grid;place-items:center;font-size:12px;box-sizing:border-box;position:relative}
.slot.sel{border-color:#fff;box-shadow:0 0 0 1px #000}
.slot b{font-size:20px}.count{position:absolute;right:3px;bottom:1px;font-size:13px}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.72);z-index:5}
#start button{font-size:20px;padding:14px 22px;background:#6b4b2a;color:#fff;border:2px solid #fff;cursor:pointer}
#inventory{position:fixed;display:none;left:50%;top:50%;transform:translate(-50%,-50%);background:#c6c6c6;border:4px solid #333;padding:18px;color:#111;z-index:4;min-width:360px}
#inventory h2{margin-top:0}.invgrid{display:grid;grid-template-columns:repeat(9,42px);gap:4px}.invslot{width:42px;height:42px;background:#8b8b8b;border:2px solid #555;display:grid;place-items:center}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="crosshair"></div>
<div id="hud"><div id="top">❤ <span id="health">10</span>/10 · Day <span id="day">1</span></div><div id="help">WASD move · Mouse look<br>Left click mine · Right click place · Space jump<br>1–9 select · E inventory</div><div id="hotbar"></div></div>
<div id="start"><button id="startBtn">🌎 Enter Realmcraft</button></div>
<div id="inventory"><h2>🎒 Inventory</h2><div id="invgrid" class="invgrid"></div><p>Press E to close</p></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="game.js"></script>
</body></html>
